<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darka 0.1</title>
<style>
  :root {
    --bg: #17141f;
    --sidebar: #14111d;
    --bg-soft: #1e1a2b;
    --panel: #241f33;
    --border: #322c46;
    --purple: #a78bfa;
    --purple-dim: #7c5cd6;
    --text: #ece9f5;
    --text-dim: #9b93b3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    height: 100%;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 14px;
  }
  .brand svg { width: 26px; height: 26px; }
  .brand span { font-weight: 650; font-size: 16px; }

  .new-chat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.12s ease;
  }
  .new-chat:hover { border-color: var(--purple-dim); background: var(--bg-soft); }
  .new-chat:active { transform: scale(0.97); }

  .chat-list-label {
    color: var(--text-dim);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 8px 8px;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.18s ease, color 0.18s ease, transform 0.15s ease;
  }
  .chat-item:hover { background: var(--bg-soft); color: var(--text); transform: translateX(2px); }
  .chat-item.active { background: var(--panel); color: var(--text); }
  .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del {
    opacity: 0;
    flex-shrink: 0;
    font-size: 15px;
    color: var(--text-dim);
    transition: opacity 0.18s ease, color 0.15s ease, transform 0.15s ease;
  }
  .chat-item:hover .del { opacity: 1; }
  .chat-item .del:hover { color: #e8b4b4; transform: scale(1.2); }

  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--text-dim);
  }
  .topbar .mascot { width: 28px; height: 28px; }
  .topbar strong { color: var(--text); font-weight: 600; }

  .workspace-toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .workspace-toggle:hover { border-color: var(--purple-dim); color: var(--text); }
  .workspace-toggle.active {
    background: rgba(167, 139, 250, 0.14);
    border-color: var(--purple);
    color: var(--purple);
  }
  .ws-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .workspace-toggle.active .ws-dot {
    background: var(--purple);
    box-shadow: 0 0 8px var(--purple);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages:empty::before {
    content: "Спроси о чём угодно у Darka 0.1 — модели, которую сделал Mr Darko.";
    color: var(--text-dim);
    font-size: 15px;
    text-align: center;
    margin: auto;
    max-width: 400px;
    animation: fadeIn 0.5s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .msg {
    max-width: 640px;
    width: fit-content;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    animation: msgIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
    transition: border-color 0.2s ease;
  }
  .msg.bot.error { border-color: #c96f6f; color: #e8b4b4; }

  .thinking { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 14px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: pulse 1.1s infinite cubic-bezier(0.45, 0, 0.55, 1); }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8) translateY(0); }
    40% { opacity: 1; transform: scale(1.15) translateY(-3px); }
  }

  .file-card {
    max-width: 420px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
    transition: border-color 0.2s ease, transform 0.15s ease;
    cursor: pointer;
  }
  .file-card:hover { border-color: var(--purple-dim); transform: translateY(-1px); }
  .file-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #14101f;
    font-size: 15px;
    font-weight: 700;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-meta { font-size: 11.5px; color: var(--text-dim); }
  .file-download {
    flex-shrink: 0;
    color: var(--purple);
    font-size: 12.5px;
    font-weight: 600;
  }

  .input-area {
    padding: 16px 20px 22px;
    border-top: 1px solid var(--border);
  }
  .attachments-bar {
    max-width: 720px;
    margin: 0 auto 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .attachments-bar:empty { display: none; }
  .attach-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 9px;
    font-size: 12px;
    color: var(--text-dim);
    animation: msgIn 0.25s ease both;
  }
  .attach-chip img {
    width: 22px; height: 22px; object-fit: cover; border-radius: 4px;
  }
  .attach-chip .remove {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 14px;
    transition: color 0.15s ease;
  }
  .attach-chip .remove:hover { color: #e8b4b4; }

  .attach-btn {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    align-self: flex-end;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
  }
  .attach-btn:hover { border-color: var(--purple-dim); color: var(--purple); }
  .attach-btn:active { transform: scale(0.93); }
  .input-row {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .input-row:focus-within {
    border-color: var(--purple-dim);
    box-shadow: 0 0 0 3px rgba(124, 92, 214, 0.15);
  }
  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    max-height: 140px;
    padding: 6px 0;
    transition: height 0.15s ease;
  }
  textarea::placeholder { color: var(--text-dim); }
  button.send {
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border: none;
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    height: 38px;
    transition: opacity 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
  }
  button.send:hover:not(:disabled) { opacity: 0.92; box-shadow: 0 4px 16px -4px rgba(167, 139, 250, 0.5); }
  button.send:active:not(:disabled) { transform: scale(0.95); }
  button.send:disabled { opacity: 0.5; cursor: default; }
  .hint { text-align: center; color: var(--text-dim); font-size: 11.5px; margin-top: 8px; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 34 Q18 14 34 20 Q40 10 50 16 Q60 10 66 20 Q82 14 78 34 Q84 40 78 48 Q82 60 68 64 Q64 76 50 74 Q36 76 32 64 Q18 60 22 48 Q16 40 22 34 Z" fill="#0d0b12"/>
        <ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
        <ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
        <circle cx="36" cy="46" r="1.6" fill="#0d0b12"/>
        <circle cx="64" cy="46" r="1.6" fill="#0d0b12"/>
        <path d="M44 60 Q50 65 56 60" stroke="#a78bfa" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <span>Darka</span>
    </div>

    <div class="new-chat" onclick="newChat()">+ Новый чат</div>

    <div class="chat-list-label">Чаты</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">Darka 0.1 · by Mr Darko</div>
  </div>

  <div class="main">
    <div class="topbar">
      <svg class="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 34 Q18 14 34 20 Q40 10 50 16 Q60 10 66 20 Q82 14 78 34 Q84 40 78 48 Q82 60 68 64 Q64 76 50 74 Q36 76 32 64 Q18 60 22 48 Q16 40 22 34 Z" fill="#0d0b12"/>
        <ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
        <ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
      </svg>
      <span><strong>Darka 0.1</strong> · разработана Mr Darko</span>
      <div class="workspace-toggle" id="workspaceToggle" onclick="toggleWorkspace()">
        <span class="ws-dot"></span>
        <span>Workspace</span>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="attachments-bar" id="attachmentsBar"></div>
      <div class="input-row">
        <button class="attach-btn" id="attachBtn" title="Прикрепить файл или изображение" onclick="document.getElementById('fileInput').click()">+</button>
        <input type="file" id="fileInput" multiple style="display:none" onchange="handleFilePick(event)">
        <textarea id="question" placeholder="Напиши сообщение... (Ctrl+V вставит скриншот)" rows="1"></textarea>
        <button class="send" id="askBtn" onclick="ask()">Отправить</button>
      </div>
      <div class="hint">Darka 0.1 может ошибаться. Enter — отправить, Shift+Enter — новая строка.</div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'darka_chats_v1';
let chats = [];
let activeId = null;
let attachments = []; // { name, isImage, dataUrl, textContent }
let workspaceMode = false;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    chats = raw ? JSON.parse(raw) : [];
  } catch (e) { chats = []; }
  if (chats.length === 0) {
    createChat();
  } else {
    activeId = chats[0].id;
  }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); } catch (e) {}
}

function createChat() {
  const chat = { id: Date.now().toString(), title: 'Новый чат', messages: [] };
  chats.unshift(chat);
  activeId = chat.id;
  save();
}

function newChat() {
  createChat();
  renderAll();
}

function getActive() {
  return chats.find(c => c.id === activeId);
}

function selectChat(id) {
  activeId = id;
  renderAll();
}

function deleteChat(id, ev) {
  ev.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (chats.length === 0) createChat();
  else if (activeId === id) activeId = chats[0].id;
  save();
  renderAll();
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    div.onclick = () => selectChat(c.id);
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = c.title;
    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = (ev) => deleteChat(c.id, ev);
    div.appendChild(title);
    div.appendChild(del);
    list.appendChild(div);
  });
}

function parseFileBlocks(content) {
  // Ищем блоки вида: ```file:имя.ext\n...содержимое...\n```
  const regex = /```file:([^\n`]+)\n([\s\S]*?)```/g;
  const parts = [];
  let lastIndex = 0;
  let match;
  while ((match = regex.exec(content)) !== null) {
    if (match.index > lastIndex) {
      parts.push({ type: 'text', content: content.slice(lastIndex, match.index) });
    }
    parts.push({ type: 'file', name: match[1].trim(), content: match[2] });
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < content.length) {
    parts.push({ type: 'text', content: content.slice(lastIndex) });
  }
  return parts.length ? parts : [{ type: 'text', content }];
}

function downloadFile(name, content) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildMessageEl(m) {
  const wrap = document.createElement('div');
  wrap.style.display = 'contents';

  const parts = parseFileBlocks(m.content);
  const hasFile = parts.some(p => p.type === 'file');

  if (!hasFile) {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot') + (m.error ? ' error' : '');
    div.textContent = m.content;
    return [div];
  }

  const elements = [];
  parts.forEach(p => {
    if (p.type === 'text' && p.content.trim()) {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot') + (m.error ? ' error' : '');
      div.textContent = p.content.trim();
      elements.push(div);
    } else if (p.type === 'file') {
      const card = document.createElement('div');
      card.className = 'msg bot file-card';
      card.onclick = () => downloadFile(p.name, p.content);
      const ext = (p.name.split('.').pop() || '?').slice(0, 3).toUpperCase();
      const sizeKb = (new Blob([p.content]).size / 1024).toFixed(1);
      card.innerHTML =
        '<div class="file-icon">' + ext + '</div>' +
        '<div class="file-info">' +
          '<div class="file-name">' + p.name + '</div>' +
          '<div class="file-meta">' + sizeKb + ' KB</div>' +
        '</div>' +
        '<div class="file-download">Скачать ↓</div>';
      elements.push(card);
    }
  });
  return elements;
}

function renderMessages() {
  return new Promise(resolve => {
    const box = document.getElementById('messages');
    box.style.opacity = '0';
    setTimeout(() => {
      box.innerHTML = '';
      const chat = getActive();
      if (chat) {
        chat.messages.forEach((m, i) => {
          const elements = buildMessageEl(m);
          elements.forEach((el, j) => {
            el.style.animationDelay = (i * 0.03 + j * 0.02) + 's';
            box.appendChild(el);
          });
        });
      }
      box.style.transition = 'opacity 0.18s ease';
      box.style.opacity = '1';
      box.scrollTop = box.scrollHeight;
      resolve();
    }, 60);
  });
}

function renderAll() {
  renderSidebar();
  return renderMessages();
}

function renderThinking() {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'thinkingMsg';
  div.innerHTML = '<div class="thinking">Thinking<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function specialReply(question) {
  const q = question.trim().toLowerCase().replace(/[?!.]/g, '');
  if (q === 'я фембой') return 'Конечно!';
  return null;
}

async function ask() {
  const input = document.getElementById('question');
  const question = input.value.trim();
  if (!question && attachments.length === 0) return;

  const chat = getActive();
  const btn = document.getElementById('askBtn');

  const attachedNote = attachments.length
    ? '\n\n[Прикреплено: ' + attachments.map(a => a.name).join(', ') + ']'
    : '';
  const textAttachmentsContent = attachments
    .filter(a => !a.isImage)
    .map(a => '\n\n--- Файл ' + a.name + ' ---\n' + a.textContent)
    .join('');

  if (chat.messages.length === 0) {
    chat.title = (question || 'Вложение').slice(0, 30) + ((question || '').length > 30 ? '…' : '');
  }

  const imagesForMsg = attachments.filter(a => a.isImage).map(a => a.dataUrl);
  chat.messages.push({
    role: 'user',
    content: (question || 'Посмотри на вложение') + attachedNote + textAttachmentsContent,
    images: imagesForMsg.length ? imagesForMsg : undefined
  });
  input.value = '';
  input.style.height = 'auto';
  clearAttachments();
  save();
  await renderAll();

  const canned = specialReply(question);
  if (canned !== null) {
    chat.messages.push({ role: 'assistant', content: canned });
    save();
    renderAll();
    return;
  }

  renderThinking();
  btn.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chat.messages, workspace: workspaceMode })
    });
    const data = await res.json();
    document.getElementById('thinkingMsg')?.remove();
    if (data.answer) {
      chat.messages.push({ role: 'assistant', content: data.answer });
    } else {
      chat.messages.push({ role: 'assistant', content: data.error || 'Что-то пошло не так.', error: true });
    }
  } catch (e) {
    document.getElementById('thinkingMsg')?.remove();
    chat.messages.push({ role: 'assistant', content: 'Не удалось связаться с сервером.', error: true });
  } finally {
    btn.disabled = false;
    save();
    renderAll();
  }
}

const ta = document.getElementById('question');
ta.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
ta.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    ask();
  }
});

function renderAttachments() {
  const bar = document.getElementById('attachmentsBar');
  bar.innerHTML = '';
  attachments.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    if (a.isImage) {
      const img = document.createElement('img');
      img.src = a.dataUrl;
      chip.appendChild(img);
    }
    const name = document.createElement('span');
    name.textContent = a.name;
    chip.appendChild(name);
    const rm = document.createElement('span');
    rm.className = 'remove';
    rm.textContent = '×';
    rm.onclick = () => { attachments.splice(i, 1); renderAttachments(); };
    chip.appendChild(rm);
    bar.appendChild(chip);
  });
}

function clearAttachments() {
  attachments = [];
  renderAttachments();
}

function addImageAttachment(file, name) {
  const reader = new FileReader();
  reader.onload = () => {
    attachments.push({ name: name || file.name || 'скриншот.png', isImage: true, dataUrl: reader.result });
    renderAttachments();
  };
  reader.readAsDataURL(file);
}

function addTextAttachment(file) {
  const reader = new FileReader();
  reader.onload = () => {
    attachments.push({ name: file.name, isImage: false, textContent: reader.result });
    renderAttachments();
  };
  reader.readAsText(file);
}

function handleFilePick(event) {
  const files = Array.from(event.target.files || []);
  files.forEach(file => {
    if (file.type.startsWith('image/')) addImageAttachment(file);
    else addTextAttachment(file);
  });
  event.target.value = '';
}

document.addEventListener('paste', function(e) {
  const items = Array.from(e.clipboardData?.items || []);
  const imageItem = items.find(it => it.type.startsWith('image/'));
  if (imageItem) {
    const file = imageItem.getAsFile();
    addImageAttachment(file, 'скриншот-' + Date.now() + '.png');
  }
});

function toggleWorkspace() {
  workspaceMode = !workspaceMode;
  document.getElementById('workspaceToggle').classList.toggle('active', workspaceMode);
  document.getElementById('question').placeholder = workspaceMode
    ? 'Workspace включён — кодинг, файлы, анализ изображений...'
    : 'Напиши сообщение... (Ctrl+V вставит скриншот)';
}

load();
renderAll();
</script>
</body>
</html>
