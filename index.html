<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Моя ИИ</title>
<style>
  :root {
    --bg: #17141f;
    --bg-soft: #1e1a2b;
    --panel: #241f33;
    --border: #322c46;
    --purple: #a78bfa;
    --purple-dim: #7c5cd6;
    --text: #ece9f5;
    --text-dim: #9b93b3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 20% -10%, #2a2140 0%, var(--bg) 45%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 40px 20px 60px;
  }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .mascot { width: 56px; height: 56px; flex-shrink: 0; }
  h1 { font-size: 26px; font-weight: 650; margin: 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-dim); font-size: 14.5px; margin: 4px 0 32px; text-align: center; }
  .card {
    width: 100%; max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 60px -20px rgba(124, 92, 214, 0.25);
  }
  textarea {
    width: 100%; min-height: 90px; resize: vertical;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  textarea::placeholder { color: var(--text-dim); }
  textarea:focus { border-color: var(--purple-dim); }
  .row { display: flex; justify-content: flex-end; margin-top: 14px; }
  button {
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: default; }
  .answer-wrap { width: 100%; max-width: 640px; margin-top: 20px; }
  .answer {
    display: none;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-left: 3px solid var(--purple-dim);
    border-radius: 12px;
    padding: 18px 20px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 15px;
    color: var(--text);
  }
  .answer.visible { display: block; }
  .answer.error { border-left-color: #c96f6f; color: #e8b4b4; }
  .thinking { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 14px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  footer { margin-top: 48px; color: var(--text-dim); font-size: 12.5px; text-align: center; }
</style>
</head>
<body>

  <div class="header">
    <svg class="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="88" rx="30" ry="6" fill="#000" opacity="0.25"/>
      <path d="M22 34 Q18 14 34 20 Q40 10 50 16 Q60 10 66 20 Q82 14 78 34 Q84 40 78 48 Q82 60 68 64 Q64 76 50 74 Q36 76 32 64 Q18 60 22 48 Q16 40 22 34 Z" fill="#0d0b12"/>
      <ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
      <ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
      <circle cx="36" cy="46" r="1.6" fill="#0d0b12"/>
      <circle cx="64" cy="46" r="1.6" fill="#0d0b12"/>
      <path d="M44 60 Q50 65 56 60" stroke="#a78bfa" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="30" r="3" fill="#a78bfa" opacity="0.8"/>
      <circle cx="80" cy="30" r="3" fill="#a78bfa" opacity="0.8"/>
    </svg>
    <h1>Спроси мою ИИ</h1>
  </div>
  <p class="subtitle">Локальная модель, свой сервер, свои правила</p>

  <div class="card">
    <textarea id="question" placeholder="Задай вопрос..."></textarea>
    <div class="row">
      <button id="askBtn" onclick="ask()">Спросить</button>
    </div>
  </div>

  <div class="answer-wrap">
    <div id="answer" class="answer"></div>
  </div>

  <footer>работает на Qwen2.5 · Ollama · Colab</footer>

<script>
async function ask() {
  const question = document.getElementById('question').value.trim();
  if (!question) return;

  const btn = document.getElementById('askBtn');
  const answerEl = document.getElementById('answer');

  btn.disabled = true;
  answerEl.classList.remove('error');
  answerEl.classList.add('visible');
  answerEl.innerHTML = '<div class="thinking">Думаю<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    if (data.answer) {
      answerEl.textContent = data.answer;
    } else {
      answerEl.classList.add('error');
      answerEl.textContent = data.error || 'Что-то пошло не так.';
    }
  } catch (e) {
    answerEl.classList.add('error');
    answerEl.textContent = 'Не удалось связаться с сервером.';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('question').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    ask();
  }
});
</script>
</body>
</html>
