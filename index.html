<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darka 0.1</title>
<style>
  :root {
    --bg: #17141f;
    --bg-soft: #1e1a2b;
    --panel: #241f33;
    --border: #322c46;
    --purple: #a78bfa;
    --purple-dim: #7c5cd6;
    --text: #ece9f5;
    --text-dim: #9b93b3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 20% -10%, #2a2140 0%, var(--bg) 45%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 24px 16px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .mascot { width: 44px; height: 44px; flex-shrink: 0; }
  h1 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 2px 0 18px; text-align: center; }

  .chat-shell {
    width: 100%;
    max-width: 680px;
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 20px 60px -20px rgba(124, 92, 214, 0.25);
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
  }

  .messages:empty::before {
    content: "Спроси о чём угодно у Darka 0.1 — модели, которую сделал Mr Darko.";
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    margin: auto;
    padding: 0 20px;
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.bot.error {
    border-color: #c96f6f;
    color: #e8b4b4;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .input-row {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    max-height: 120px;
    transition: border-color 0.15s ease;
  }
  textarea::placeholder { color: var(--text-dim); }
  textarea:focus { border-color: var(--purple-dim); }

  button {
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: default; }

  .toolbar {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .clear-btn {
    background: none;
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 4px 8px;
    text-decoration: underline;
  }
  .clear-btn:hover { color: var(--text); opacity: 1; }

  footer { margin-top: 14px; color: var(--text-dim); font-size: 12px; text-align: center; }
</style>
</head>
<body>

  <div class="header">
    <svg class="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 34 Q18 14 34 20 Q40 10 50 16 Q60 10 66 20 Q82 14 78 34 Q84 40 78 48 Q82 60 68 64 Q64 76 50 74 Q36 76 32 64 Q18 60 22 48 Q16 40 22 34 Z" fill="#0d0b12"/>
      <ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
      <ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
      <circle cx="36" cy="46" r="1.6" fill="#0d0b12"/>
      <circle cx="64" cy="46" r="1.6" fill="#0d0b12"/>
      <path d="M44 60 Q50 65 56 60" stroke="#a78bfa" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="30" r="3" fill="#a78bfa" opacity="0.8"/>
      <circle cx="80" cy="30" r="3" fill="#a78bfa" opacity="0.8"/>
    </svg>
    <h1>Darka 0.1</h1>
  </div>
  <p class="subtitle">разработана Mr Darko</p>

  <div class="chat-shell">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <textarea id="question" placeholder="Напиши сообщение..." rows="1"></textarea>
      <button id="askBtn" onclick="ask()">Отправить</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="clear-btn" onclick="clearChat()">Очистить чат</button>
  </div>

  <footer>Darka 0.1 · работает на собственном сервере Mr Darko</footer>

<script>
let history = [];

function render() {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  history.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot') + (m.error ? ' error' : '');
    div.textContent = m.content;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function renderThinking() {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'thinkingMsg';
  div.innerHTML = '<div class="thinking">Думаю<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function ask() {
  const input = document.getElementById('question');
  const question = input.value.trim();
  if (!question) return;

  const btn = document.getElementById('askBtn');
  history.push({ role: 'user', content: question });
  input.value = '';
  input.style.height = 'auto';
  render();
  renderThinking();
  btn.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    document.getElementById('thinkingMsg')?.remove();
    if (data.answer) {
      history.push({ role: 'assistant', content: data.answer });
    } else {
      history.push({ role: 'assistant', content: data.error || 'Что-то пошло не так.', error: true });
    }
  } catch (e) {
    document.getElementById('thinkingMsg')?.remove();
    history.push({ role: 'assistant', content: 'Не удалось связаться с сервером.', error: true });
  } finally {
    btn.disabled = false;
    render();
  }
}

function clearChat() {
  history = [];
  render();
}

const ta = document.getElementById('question');
ta.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
ta.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    ask();
  }
});
</script>
</body>
</html>
