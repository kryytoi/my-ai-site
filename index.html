<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darka 0.1</title>
<style>
  :root {
    --bg: #17141f;
    --sidebar: #14111d;
    --bg-soft: #1e1a2b;
    --panel: #241f33;
    --border: #322c46;
    --purple: #a78bfa;
    --purple-dim: #7c5cd6;
    --text: #ece9f5;
    --text-dim: #9b93b3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    height: 100%;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 14px;
  }
  .brand svg { width: 26px; height: 26px; }
  .brand span { font-weight: 650; font-size: 16px; }

  .new-chat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.12s ease;
  }
  .new-chat:hover { border-color: var(--purple-dim); background: var(--bg-soft); }
  .new-chat:active { transform: scale(0.97); }

  .chat-list-label {
    color: var(--text-dim);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 8px 8px;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.18s ease, color 0.18s ease, transform 0.15s ease;
  }
  .chat-item:hover { background: var(--bg-soft); color: var(--text); transform: translateX(2px); }
  .chat-item.active { background: var(--panel); color: var(--text); }
  .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del {
    opacity: 0;
    flex-shrink: 0;
    font-size: 15px;
    color: var(--text-dim);
    transition: opacity 0.18s ease, color 0.15s ease, transform 0.15s ease;
  }
  .chat-item:hover .del { opacity: 1; }
  .chat-item .del:hover { color: #e8b4b4; transform: scale(1.2); }

  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--text-dim);
  }
  .topbar .mascot { width: 28px; height: 28px; }
  .topbar strong { color: var(--text); font-weight: 600; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .messages:empty::before {
    content: "Спроси о чём угодно у Darka 0.1 — модели, которую сделал Mr Darko.";
    color: var(--text-dim);
    font-size: 15px;
    text-align: center;
    margin: auto;
    max-width: 400px;
    animation: fadeIn 0.5s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .msg {
    max-width: 640px;
    width: fit-content;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    animation: msgIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
    transition: border-color 0.2s ease;
  }
  .msg.bot.error { border-color: #c96f6f; color: #e8b4b4; }

  .thinking { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 14px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: pulse 1.1s infinite cubic-bezier(0.45, 0, 0.55, 1); }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8) translateY(0); }
    40% { opacity: 1; transform: scale(1.15) translateY(-3px); }
  }

  .input-area {
    padding: 16px 20px 22px;
    border-top: 1px solid var(--border);
  }
  .input-row {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .input-row:focus-within {
    border-color: var(--purple-dim);
    box-shadow: 0 0 0 3px rgba(124, 92, 214, 0.15);
  }
  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    max-height: 140px;
    padding: 6px 0;
    transition: height 0.15s ease;
  }
  textarea::placeholder { color: var(--text-dim); }
  button.send {
    background: linear-gradient(135deg, var(--purple-dim), var(--purple));
    color: #14101f;
    border: none;
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    height: 38px;
    transition: opacity 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
  }
  button.send:hover:not(:disabled) { opacity: 0.92; box-shadow: 0 4px 16px -4px rgba(167, 139, 250, 0.5); }
  button.send:active:not(:disabled) { transform: scale(0.95); }
  button.send:disabled { opacity: 0.5; cursor: default; }
  .hint { text-align: center; color: var(--text-dim); font-size: 11.5px; margin-top: 8px; }
</style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 34 Q18 14 34 20 Q40 10 50 16 Q60 10 66 20 Q82 14 78 34 Q84 40 78 48 Q82 60 68 64 Q64 76 50 74 Q36 76 32 64 Q18 60 22 48 Q16 40 22 34 Z" fill="#0d0b12"/>
        <ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
        <ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
        <circle cx="36" cy="46" r="1.6" fill="#0d0b12"/>
        <circle cx="64" cy="46" r="1.6" fill="#0d0b12"/>
        <path d="M44 60 Q50 65 56 60" stroke="#a78bfa" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <span>Darka</span>
    </div>

    <div class="new-chat" onclick="newChat()">+ Новый чат</div>

    <div class="chat-list-label">Чаты</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">Darka 0.1 · by Mr Darko</div>
  </div>

  <div class="main">
    <div class="topbar">
      <svg class="mascot" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 34 Q18 14 34 20 Q40 10 50 16 Q60 10 66 20 Q82 14 78 34 Q84 40 78 48 Q82 60 68 64 Q64 76 50 74 Q36 76 32 64 Q18 60 22 48 Q16 40 22 34 Z" fill="#0d0b12"/>
        <ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
        <ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#a78bfa"/>
      </svg>
      <span><strong>Darka 0.1</strong> · разработана Mr Darko</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="question" placeholder="Напиши сообщение..." rows="1"></textarea>
        <button class="send" id="askBtn" onclick="ask()">Отправить</button>
      </div>
      <div class="hint">Darka 0.1 может ошибаться. Enter — отправить, Shift+Enter — новая строка.</div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'darka_chats_v1';
let chats = [];
let activeId = null;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    chats = raw ? JSON.parse(raw) : [];
  } catch (e) { chats = []; }
  if (chats.length === 0) {
    createChat();
  } else {
    activeId = chats[0].id;
  }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); } catch (e) {}
}

function createChat() {
  const chat = { id: Date.now().toString(), title: 'Новый чат', messages: [] };
  chats.unshift(chat);
  activeId = chat.id;
  save();
}

function newChat() {
  createChat();
  renderAll();
}

function getActive() {
  return chats.find(c => c.id === activeId);
}

function selectChat(id) {
  activeId = id;
  renderAll();
}

function deleteChat(id, ev) {
  ev.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (chats.length === 0) createChat();
  else if (activeId === id) activeId = chats[0].id;
  save();
  renderAll();
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    div.onclick = () => selectChat(c.id);
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = c.title;
    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = (ev) => deleteChat(c.id, ev);
    div.appendChild(title);
    div.appendChild(del);
    list.appendChild(div);
  });
}

function renderMessages() {
  const box = document.getElementById('messages');
  box.style.opacity = '0';
  setTimeout(() => {
    box.innerHTML = '';
    const chat = getActive();
    if (chat) {
      chat.messages.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot') + (m.error ? ' error' : '');
        div.style.animationDelay = (i * 0.03) + 's';
        div.textContent = m.content;
        box.appendChild(div);
      });
    }
    box.style.transition = 'opacity 0.18s ease';
    box.style.opacity = '1';
    box.scrollTop = box.scrollHeight;
  }, 60);
}

function renderAll() {
  renderSidebar();
  renderMessages();
}

function renderThinking() {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'thinkingMsg';
  div.innerHTML = '<div class="thinking">Думаю<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function specialReply(question) {
  const q = question.trim().toLowerCase().replace(/[?!.]/g, '');
  if (q === 'я фембой') return 'Конечно!';
  return null;
}

async function ask() {
  const input = document.getElementById('question');
  const question = input.value.trim();
  if (!question) return;

  const chat = getActive();
  const btn = document.getElementById('askBtn');

  if (chat.messages.length === 0) {
    chat.title = question.slice(0, 30) + (question.length > 30 ? '…' : '');
  }

  chat.messages.push({ role: 'user', content: question });
  input.value = '';
  input.style.height = 'auto';
  save();
  renderAll();

  const canned = specialReply(question);
  if (canned !== null) {
    chat.messages.push({ role: 'assistant', content: canned });
    save();
    renderAll();
    return;
  }

  renderThinking();
  btn.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chat.messages })
    });
    const data = await res.json();
    document.getElementById('thinkingMsg')?.remove();
    if (data.answer) {
      chat.messages.push({ role: 'assistant', content: data.answer });
    } else {
      chat.messages.push({ role: 'assistant', content: data.error || 'Что-то пошло не так.', error: true });
    }
  } catch (e) {
    document.getElementById('thinkingMsg')?.remove();
    chat.messages.push({ role: 'assistant', content: 'Не удалось связаться с сервером.', error: true });
  } finally {
    btn.disabled = false;
    save();
    renderAll();
  }
}

const ta = document.getElementById('question');
ta.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});
ta.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    ask();
  }
});

load();
renderAll();
</script>
</body>
</html>
